<app-responsive-modal [open]="open()" (openChange)="openChange.emit($event)" [minTranslateY]="0" [handleBc]="false" [showFooter]="true" [showActionBar]="false">
  <div class="modal-header pt-3 ps-3 pe-3 pb-0">
    <h4 class="modal-title">Edit Word</h4>
  </div>
  <div class="modal-body p-3">
    <div class="mb-3">
      <label for="editWordText" class="form-label">Word</label>
      <div class="input-with-keyboard">
        <input #wordInputEl type="text" id="editWordText" class="form-control" name="editWordText" inputmode="none" readonly [ngModel]="text" (focus)="isKeyboardOpen.set(true)" />
        <button type="button" #kbToggleEl class="btn-keyboard-toggle" (click)="isKeyboardOpen.set(!isKeyboardOpen())">
          <i class="ti ti-keyboard" aria-hidden="true"></i>
        </button>
      </div>
    </div>
    @if (spellingChars.length > 0) {
        <div class="mb-3">
            <label class="form-label">Rōmaji</label>
            <div class="d-flex gap-2 flex-row flex-nowrap spelling-row p-1">
                @for (char of spellingChars; track $index) {
                    <input type="text" class="form-control text-center spelling-box" [name]="'spellingChar' + $index" [(ngModel)]="spellingChars[$index]" />
                }
            </div>
        </div>
    }
    <div class="mb-3">
      <label for="editWordTranslation" class="form-label">Translation</label>
      <input type="text" id="editWordTranslation" class="form-control" name="editWordTranslation" [(ngModel)]="translation" />
    </div>
    <div class="mb-3">
      <div class="d-flex justify-content-between align-items-center mb-1">
        <label for="editWordDescription" class="form-label mb-0">Description</label>
        <span class="text-muted small" [class.text-danger]="description.length >= 150">
          {{ description.length }}/150
        </span>
      </div>
      <textarea id="editWordDescription" maxlength="150" class="form-control description" placeholder="Es. Common Japanese greeting meaning 'hello' or 'good afternoon.' It's typically used during the daytime, between mid-morning and early evening, and is one of the most widely recognized Japanese expressions, often used as a general-purpose greeting even outside Japan." name="editWordDescription" [(ngModel)]="description"></textarea>
    </div>
    <div  [class.mb-2] = "!mobileService.isMobile()" [class.pb-2] = "!mobileService.isMobile()" [class.mb-5] = "mobileService.isMobile()" [class.pb-5] = "mobileService.isMobile()">
      <label class="form-label">Category</label>
      <div class="d-flex flex-nowrap gap-2 category-list">
        @for (category of categoriesService.categories(); track category.name) {
            <button type="button" class="chip category-chip" [class.active]="categoryId === category.name" [style.background]="'#'+category.color" (click)="categoryId = category.name">
                <i class="ti" [class]="category.icon"></i>
                <span>{{ category.name }}</span>
            </button>
        }
      </div>
    </div>
  </div>
  <div modal-footer class="d-flex gap-4 w-100 align-items-center justify-content-center pt-4 pb-4">
    <button type="button" class="btn btn-create rounded-4 pe-4 ps-4" (click)="onSave()" [disabled]="!isFormValid()" [class.w-100]="mobileService.isMobile()">Save</button>
  </div>
</app-responsive-modal>

<app-kana-keyboard [(open)]="isKeyboardOpen" [value]="text" (valueChange)="onWordTextChange($event)" [(mode)]="wordType" [targetEl]="wordInputEl" [toggleEl]="kbToggleEl" />
