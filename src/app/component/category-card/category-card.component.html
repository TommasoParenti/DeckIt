<div class="card cat-card h-100 border-0 rounded-4 p-3 text-white overflow-hidden justify-content-between" [style.--accent]="'#' + (bgColor() ?? '6c757d')" (click)="onCardClick()">
  <i class="ti cat-card__bg-icon position-absolute bottom-0 end-0 z-0 pe-none opacity-25" [class]="icon()"></i>
  <h6 class="z-1 w-75 mb-0 fw-bold lh-sm">
    <button type="button" class="title stretched-link bg-transparent border-0 p-0 text-reset text-start fw-bold text-uppercase">
      {{ name() }}
    </button>
  </h6>
  <div class="z-1 pe-none d-flex align-items-baseline gap-2">
    <span class="fs-1 fw-bold lh-1">{{ nWords() ?? 0 }}</span>
    <span class="small opacity-75">{{ nWords() === 1 ? 'word' : 'words' }}</span>
  </div>
</div>
